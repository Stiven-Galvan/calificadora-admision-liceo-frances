name: Importar proyecto completo
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obtener repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
      - name: Verificar e importar los archivos del proyecto
        shell: bash
        run: |
          set -euo pipefail
          cat import-source.part01 import-source.part02 > source-export.tar.gz
          echo '7799e60adda3b09b7ead0242e9c11aa973e67d25c03d632119a86b662fc9f5f1  source-export.tar.gz' | sha256sum --check -
          tar -xzf source-export.tar.gz --no-same-owner
          rm source-export.tar.gz import-source.part01 import-source.part02 .github/workflows/importar-fuentes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git diff --cached --quiet && exit 0
          git commit -m 'Importar aplicación completa de admisión y retirar archivos temporales'
          git push origin HEAD:main
